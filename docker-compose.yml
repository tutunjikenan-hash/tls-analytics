# Local production-like stack: Postgres + the dashboard.  docker compose up --build
# For real deployments use a managed Postgres (Supabase, Neon, RDS...) and set the env vars there.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
      POSTGRES_DB: tls
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-change-me-local-only}@db:5432/tls
      DATABASE_SSL: disable
volumes:
  pgdata:
